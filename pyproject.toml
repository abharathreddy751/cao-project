[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caosched"
version = "0.1.0"
description = "Prediction-aware dynamic task scheduling and offloading for DAG workloads on heterogeneous P/E cores"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
