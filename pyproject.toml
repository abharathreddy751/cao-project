[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caosched"
version = "0.1.0"
description = "Prediction-aware dynamic task scheduling and offloading for DAG workloads on heterogeneous P/E cores"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26", "pillow>=10.0", "psutil>=5.9", "PyYAML>=6.0", "pandas>=2.1",
    "scipy>=1.11", "matplotlib>=3.8", "catboost>=1.2", "astropy>=6.0", "pegasus-wms.api>=5.0", "requests>=2.31",
]

[project.optional-dependencies]
# CUDA wheel: pip install torch --index-url https://download.pytorch.org/whl/cu128 (driver 581.83 tested)
gpu = ["torch>=2.5"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
